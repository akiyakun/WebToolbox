# WebToolbox を配る nginx の設定（イメージの /etc/nginx/conf.d/default.conf を置き換える）
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript;

    # 更新したらすぐ反映されるように、毎回サーバーに確認させる（変わっていなければ 304 で中身は送らない）
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # 読み込むのは自分のファイルだけ。ほかのサイトの iframe に埋め込ませない
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    # コンテナの死活確認用
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
