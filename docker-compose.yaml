services:
  webtoolbox:
    build: .
    image: webtoolbox:0.1.0
    container_name: webtoolbox
    restart: unless-stopped
    ports:
      - "${WT_BIND_IP:-127.0.0.1}:${WT_PORT:-8000}:8080"
    environment:
      TZ: Asia/Tokyo
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    # 静的ファイルを配るだけ。つなぐフォルダはない（ツールの状態は各ブラウザの localStorage に保存される）
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
