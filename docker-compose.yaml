services:
  webtoolbox:
    build: .
    image: webtoolbox:0.2.0
    container_name: webtoolbox
    restart: unless-stopped
    ports:
      - "${WT_BIND_IP:-127.0.0.1}:${WT_PORT:-8000}:8000"
    # このアプリ専用の NAS ユーザーで動かす（UGOS に登録したユーザーでないと、共有フォルダのアクセス権が効かない）。
    # ファイルはグループのメンバーも書き換えられる設定で作る（Dockerfile の WT_UMASK）ので、SMB からも整理できる
    user: "${WT_UID:?Set WT_UID in .env}:${WT_GID:?Set WT_GID in .env}"
    environment:
      TZ: Asia/Tokyo
      # 受け付けるホスト名（DNS リバインディング対策）。* は使わない
      WT_ALLOWED_HOSTS: "${WT_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    volumes:
      # メモ帳・付箋などの中身（docs/）と、上書き前の控え（backup/）
      - type: bind
        source: "${WT_DATA_DIR:?Set WT_DATA_DIR in .env}"
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
